<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP4N-LAPOR!</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="appFrame" src="/cloud.html" title="SP4N-LAPOR!"></iframe>
<script>
const frame=document.getElementById('appFrame');
const DEMO_USERS={
  admin:{email:'admin@sp4n-lapor.local',role:'admin'},
  masyarakat:{email:'masyarakat@sp4n-lapor.local',role:'masyarakat'}
};
function w(){return frame.contentWindow}
function patchLogin(){
  const x=w();
  if(!x||!x.document)return;
  const modal=x.document.getElementById('authModal');
  if(!modal)return;
  const box=modal.querySelector('.modalbox');
  if(!box)return;
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="tag">LOGIN DEMO</span><h2 style="margin:7px 0">Masuk ke SP4N-LAPOR!</h2></div><button class="btn outline" onclick="closeAuth()">✕</button></div><p class="muted">Gunakan akun demo untuk demonstrasi prototype. Data laporan tetap disimpan di Supabase.</p><div class="label">Username</div><input id="demoUsername" class="input" placeholder="masyarakat atau admin"><div class="label">Password</div><input id="demoPassword" type="password" class="input" placeholder="123456"><div class="notice info"><b>Akun demo:</b><br>masyarakat / 123456<br>admin / 123456</div><button class="btn primary" style="width:100%" onclick="demoLogin()">Masuk</button>`;
  x.demoLogin=async function(){
    const username=(x.document.getElementById('demoUsername')?.value||'').trim().toLowerCase();
    const password=x.document.getElementById('demoPassword')?.value||'';
    const account=DEMO_USERS[username];
    if(!account||password!=='123456')return x.msg('Username atau password demo salah.');
    const {error}=await x.db.auth.signInWithPassword({email:account.email,password});
    if(error){
      if(username==='masyarakat'){
        const {data,error:signupError}=await x.db.auth.signUp({email:account.email,password,options:{data:{full_name:'Masyarakat Demo',username:'masyarakat',role:'masyarakat'}}});
        if(signupError)return x.msg('Akun masyarakat belum dapat dibuat otomatis: '+signupError.message);
        if(!data.session)return x.msg('Akun masyarakat berhasil dibuat. Supabase meminta verifikasi email sebelum login pertama.');
        x.closeAuth();
        await x.refreshSession();
        return x.msg('Login masyarakat berhasil.',true);
      }
      return x.msg('Login admin gagal: '+error.message);
    }
    x.closeAuth();
    await x.refreshSession();
    x.msg('Login berhasil sebagai '+(username==='admin'?'Admin':'Masyarakat')+'.',true);
  };
}
frame.addEventListener('load',()=>setTimeout(patchLogin,100));
</script>
</body>
</html>
