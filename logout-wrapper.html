<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP4N-LAPOR!</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body>
<iframe id="appFrame" src="/app.html" title="SP4N-LAPOR!"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const frame=document.getElementById('appFrame');
const SUPABASE_URL='https://hlccvnslfqbrojlqlxdk.supabase.co';
const SUPABASE_KEY='sb_publishable_NrUmgLgfwejDE2fZwrjtvA_ajdTugPj';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function win(){return frame.contentWindow}
async function getSession(){const {data:{session}}=await db.auth.getSession();return session}
async function getProfile(uid){const {data}=await db.from('profiles').select('*').eq('id',uid).maybeSingle();return data}
function emailForUsername(u){if(String(u).includes('@'))return u.trim();if(u==='admin')return 'admin@sp4n-lapor.local';return String(u).trim()+'@sp4n-lapor.local'}
function mapReport(r,rating){return {id:r.id,type:r.report_type,title:r.title,category:r.category,routing:r.routing,body:r.body,owner:r.profiles?.full_name||r.user_id,status:r.status,created:r.created_at?new Date(r.created_at).toLocaleString('id-ID'):'',progress:r.status==='Selesai'?100:35,completedAt:r.completed_at?new Date(r.completed_at).toLocaleString('id-ID'):'',completionNote:r.admin_note||'',rating:rating?.stars||null,review:rating?.review||''}}
async function afterAuth(){const session=await getSession();const w=win();if(!session){w.currentUser=null;w.selectedLoginRole='';w.renderAccount();return}w.__cloudAuth=session;w.currentUser={username:(session.user.user_metadata?.username||session.user.email.split('@')[0]),role:'Masyarakat'};const profile=await getProfile(session.user.id);w.currentProfile=profile;w.currentUser.role=profile?.role==='admin'?'Admin':'Masyarakat';w.renderAccount();if(profile?.role==='admin')w.adminDash()}
function injectOverrides(){const w=win();
 w.showLoginForm=function(role){w.selectedLoginRole=role;const demo=role==='Admin'?'admin / 123456':'masyarakat / password akun';w.document.getElementById('loginForm').innerHTML='<div class="label">Username / email</div><input id="loginUser" class="input" placeholder="admin atau email Anda"><div class="label">Password</div><input id="loginPass" type="password" class="input"><div class="notice info"><b>Login:</b> '+demo+'</div><button class="btn primary" style="width:100%" onclick="login()">Masuk sebagai '+role+'</button>'+(role==='Masyarakat'?'<button class="btn outline" style="width:100%;margin-top:8px" onclick="signupCitizen()">Daftar akun masyarakat</button>':'')};
 w.login=async function(){const u=w.document.getElementById('loginUser').value.trim(),p=w.document.getElementById('loginPass').value;if(!u||!p)return w.toastMsg('Username/email dan password wajib diisi.');const {error}=await db.auth.signInWithPassword({email:emailForUsername(u),password:p});if(error)return w.toastMsg(error.message);w.closeLogin();await afterAuth();w.toastMsg('Login berhasil.')};
 w.signupCitizen=async function(){const u=w.document.getElementById('loginUser').value.trim(),p=w.document.getElementById('loginPass').value.trim();if(!u||!p||p.length<6)return w.toastMsg('Untuk daftar gunakan email lengkap dan password minimal 6 karakter.');if(!u.includes('@'))return w.toastMsg('Untuk pendaftaran masyarakat gunakan email, misalnya nama@email.com.');const {data,error}=await db.auth.signUp({email:u,password:p,options:{data:{full_name:u.split('@')[0],role:'masyarakat'}}});if(error)return w.toastMsg(error.message);if(data.session){w.closeLogin();await afterAuth();w.toastMsg('Akun masyarakat berhasil dibuat.')}else w.toastMsg('Akun dibuat. Cek email untuk verifikasi lalu login.')};
 w.logout=async function(){await db.auth.signOut();w.currentUser=null;w.currentProfile=null;w.document.getElementById('serviceTitle').textContent='Pilih layanan untuk memulai';w.document.getElementById('serviceDesc').textContent='Data tersimpan di database Supabase dan dapat diakses lintas perangkat.';w.document.getElementById('serviceBody').innerHTML='';w.document.getElementById('trackResult').innerHTML='';w.document.getElementById('track').value='';w.document.getElementById('learn').classList.add('hidden');w.document.getElementById('home').classList.remove('hidden');w.renderAccount();w.toastMsg('Anda telah logout.')};
 w.submitCitizenReport=async function(type){const title=w.document.getElementById('fTitle').value.trim(),body=w.document.getElementById('fBody').value.trim();if(!title||!body)return w.toastMsg('Judul dan isi wajib diisi.');const session=await getSession();if(!session)return w.openLogin();const tracking=(type==='Pengaduan'?'LP':'AS')+'-2026-'+Math.floor(100000+Math.random()*900000);const payload={tracking_id:tracking,user_id:session.user.id,report_type:type,title,body,category:w.document.getElementById('fCat').value,routing:w.document.getElementById('fRoute').value,is_anonymous:w.document.getElementById('anon').checked,is_confidential:w.document.getElementById('secret').checked};const {data,error}=await db.from('reports').insert(payload).select().single();if(error)return w.toastMsg(error.message);await db.from('report_updates').insert({report_id:data.id,actor_id:session.user.id,status:'Dalam proses',note:'Laporan diterima dan masuk proses verifikasi/routing.'});w.document.getElementById('track').value=tracking;w.renderCitizenResult(mapReport(data));w.toastMsg('Laporan tersimpan permanen di database.')};
 w.trackReport=async function(){const session=await getSession();if(!session)return w.openLogin();const id=w.document.getElementById('track').value.trim();if(!id)return w.toastMsg('Masukkan Tracking ID.');const {data,error}=await db.from('reports').select('*,profiles(full_name),ratings(*)').eq('tracking_id',id).eq('user_id',session.user.id).maybeSingle();if(error||!data)return w.document.getElementById('trackResult').innerHTML='<div class="notice warn">Tracking ID tidak ditemukan pada laporan milik akun ini.</div>';const r=mapReport(data,data.ratings?.[0]);w.document.getElementById('trackResult').innerHTML=w.trackHtml(r);if(data.status==='Selesai'&&!data.ratings?.length){w.selectedRating=0}};
 w.submitRating=async function(id){if(!w.selectedRating)return w.toastMsg('Pilih jumlah bintang terlebih dahulu.');const session=await getSession();if(!session)return w.openLogin();const {error}=await db.from('ratings').upsert({report_id:id,user_id:session.user.id,stars:w.selectedRating,review:w.document.getElementById('review').value.trim()},{onConflict:'report_id'});if(error)return w.toastMsg(error.message);w.toastMsg('Penilaian berhasil disimpan.');await w.trackReport()};
 w.adminDash=async function(){if(w.currentProfile?.role!=='admin')return w.toastMsg('Akses admin ditolak.');w.document.getElementById('home').classList.add('hidden');w.document.getElementById('learn').classList.add('hidden');w.document.getElementById('servicePanel').classList.add('hidden');const box=w.document.getElementById('servicePanel');box.classList.remove('hidden');const {data,error}=await db.from('reports').select('*,profiles(full_name),ratings(*)').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="notice warn">'+esc(error.message)+'</div>';return}const rows=(data||[]).map(r=>mapReport(r,r.ratings?.[0]));const active=rows.filter(r=>r.status!=='Selesai').length,done=rows.filter(r=>r.status==='Selesai').length,rated=rows.filter(r=>r.rating).length;w.document.getElementById('serviceTitle').textContent='Dashboard Admin';w.document.getElementById('serviceDesc').textContent='Data berasal dari Supabase dan dapat diakses lintas perangkat. Admin dapat memperbarui status laporan.';w.document.getElementById('serviceBody').innerHTML='<div class="grid4"><div class="stat"><div class="metric">'+rows.length+'</div><small>Total laporan</small></div><div class="stat"><div class="metric">'+active+'</div><small>Dalam proses</small></div><div class="stat"><div class="metric">'+done+'</div><small>Selesai</small></div><div class="stat"><div class="metric">'+rated+'</div><small>Sudah dinilai</small></div></div><div class="list" style="margin-top:14px">'+(rows.length?rows.map(r=>w.adminRow(r)).join(''):'<div class="notice info">Belum ada laporan masyarakat.</div>')+'</div>';box.scrollIntoView({behavior:'smooth'})};
 w.completeReport=async function(id){const session=await getSession();if(!session)return w.openLogin();const note=w.prompt('Masukkan catatan penyelesaian untuk masyarakat:','Laporan telah ditindaklanjuti dan dinyatakan selesai.');if(note===null)return;const {error}=await db.from('reports').update({status:'Selesai',admin_note:note,completed_at:new Date().toISOString()}).eq('id',id);if(error)return w.toastMsg(error.message);await db.from('report_updates').insert({report_id:id,actor_id:session.user.id,status:'Selesai',note});await w.adminDash();w.toastMsg('Status laporan diperbarui menjadi Selesai.')};
 w.showInfoExamples=async function(){const {data,error}=await db.from('completed_reports_public').select('*').order('completed_at',{ascending:false});w.document.getElementById('serviceTitle').textContent='Permintaan Informasi — informasi yang tersedia';w.document.getElementById('serviceDesc').textContent='Tiga contoh dummy tetap tersedia. Laporan masyarakat yang selesai juga tersedia sebagai informasi hasil layanan.';let html='<div class="list">'+w.INFO_DUMMIES.map(x=>w.infoRow(x,false)).join('');if(error)html+='<div class="notice warn">'+esc(error.message)+'</div>';else if((data||[]).length)html+=(data||[]).map(x=>'<div class="row"><span class="badge good">SELESAI · HASIL LAYANAN</span><h3>'+esc(x.tracking_id)+' — '+esc(x.title)+'</h3><p class="muted">'+esc(x.report_type)+' · '+esc(x.category)+' · '+esc(x.routing)+' · selesai '+esc(x.completed_at?new Date(x.completed_at).toLocaleString('id-ID'):'')+'</p><div class="notice good"><b>Catatan penyelesaian:</b> '+esc(x.completion_note||'Laporan telah diselesaikan oleh instansi tujuan.')+(x.rating_stars?' · Rating masyarakat '+x.rating_stars+' ★':'')+'</div><button class="btn outline" onclick="openCompletedInfo(\''+x.id+'\')">Lihat detail</button></div>').join('');else html+='<div class="notice info">Belum ada Pengaduan/Aspirasi yang selesai.</div>';html+='</div>';w.document.getElementById('serviceBody').innerHTML=html;w.document.getElementById('servicePanel').scrollIntoView({behavior:'smooth'})};
 w.openCompletedInfo=async function(id){const {data,error}=await db.from('completed_reports_public').select('*').eq('id',id).maybeSingle();if(error||!data)return w.toastMsg('Informasi hasil layanan tidak ditemukan.');w.document.getElementById('serviceBody').innerHTML='<div class="row"><span class="badge good">SELESAI · HASIL LAYANAN</span><h3>'+esc(data.title)+'</h3><p class="muted">'+esc(data.report_type)+' · '+esc(data.routing)+' · selesai '+esc(data.completed_at?new Date(data.completed_at).toLocaleString('id-ID'):'')+'</p><div class="notice good"><b>Hasil tindak lanjut:</b> '+esc(data.completion_note||'Laporan telah diselesaikan oleh instansi tujuan.')+'</div><p><b>Kategori:</b> '+esc(data.category)+'</p><p><b>Status:</b> Selesai</p><button class="btn outline" onclick="showInfoExamples()">← Kembali ke informasi</button></div>'};
 w.renderAccount=function(){const b=w.document.getElementById('accountBar'),ab=w.document.getElementById('adminBtn');if(!w.currentUser){b.classList.add('hidden');ab.classList.add('hidden');return}b.classList.remove('hidden');w.document.getElementById('welcome').textContent='Halo, '+w.currentUser.username;w.document.getElementById('roleText').textContent='Role: '+w.currentUser.role+(w.currentUser.role==='Admin'?' · akses monitoring & pengelolaan laporan':' · akses laporan milik sendiri');ab.classList.toggle('hidden',w.currentUser.role!=='Admin')};
 afterAuth();
}
frame.addEventListener('load',()=>{injectOverrides()});
</script>
</body></html>
