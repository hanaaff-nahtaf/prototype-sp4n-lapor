<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP4N-LAPOR!</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body>
<iframe id="appFrame" src="/cloud.html" title="SP4N-LAPOR!"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  setTimeout(()=>{
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;
      if(doc.getElementById('citizenEnhancements')) return;
      const s=doc.createElement('script');s.id='citizenEnhancements';s.src='/citizen-enhancements.js?v=2';doc.body.appendChild(s);
    }catch(e){console.error(e)}
  },100);
});
</script>
</body>
</html>
